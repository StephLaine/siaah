<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B3" />
      <stop offset="30%" stop-color="#E5C060" />
      <stop offset="70%" stop-color="#B88A2E" />
      <stop offset="100%" stop-color="#805E14" />
    </linearGradient>

    <!-- Rich Red Gradient -->
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="50%" stop-color="#C1272D" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Blue Shading Gradients (Left and Right halves) -->
    <linearGradient id="blue-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2B6D" />
      <stop offset="100%" stop-color="#0A102E" />
    </linearGradient>
    <linearGradient id="blue-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D163D" />
      <stop offset="100%" stop-color="#05081A" />
    </linearGradient>
  </defs>

  <!-- ================= SHIELD & GRAPHICS GROUP ================= -->
  <!-- Scaled and positioned on the left side with explicit separation -->
  <g transform="translate(-25, 5) scale(0.33)">
    <!-- Outer Gold Border -->
    <path d="M 130 110 Q 215 85 300 70 Q 385 85 470 110 C 470 260 420 380 300 450 C 180 380 130 260 130 110 Z" 
          fill="url(#gold-grad)" />

    <!-- Inner Red Border -->
    <path d="M 138 116 Q 219 92 300 78 Q 381 92 462 116 C 462 255 414 368 300 436 C 186 368 138 255 138 116 Z" 
          fill="url(#red-grad)" />

    <!-- Inner Gold Lining -->
    <path d="M 148 124 Q 224 102 300 89 Q 376 102 452 124 C 452 250 406 352 300 420 C 194 352 148 250 148 124 Z" 
          fill="url(#gold-grad)" />

    <!-- Left Blue Background Half -->
    <path d="M 300 93 Q 227 106 152 128 C 152 247 197 348 300 415 Z" 
          fill="url(#blue-grad-left)" />

    <!-- Right Blue Background Half -->
    <path d="M 300 93 Q 373 106 448 128 C 448 247 403 348 300 415 Z" 
          fill="url(#blue-grad-right)" />

    <!-- central star -->
    <polygon points="300,122 304,131 313,131 306,136 308,145 300,140 292,145 294,136 287,131 296,131" 
             fill="url(#gold-grad)" />
             
    <!-- laurels leaves left -->
    <path d="M 235 125 C 230 120 220 120 218 128 C 220 132 230 130 235 125 Z" fill="url(#gold-grad)" />
    <path d="M 225 138 C 220 132 210 135 210 143 C 215 146 222 142 225 138 Z" fill="url(#gold-grad)" />
    <path d="M 220 152 C 215 148 205 152 208 160 C 213 162 218 156 220 152 Z" fill="url(#gold-grad)" />
    <path d="M 222 168 C 218 164 210 170 212 178 C 218 178 220 172 222 168 Z" fill="url(#gold-grad)" />

    <!-- laurels leaves right -->
    <path d="M 365 125 C 370 120 380 120 382 128 C 380 132 370 130 365 125 Z" fill="url(#gold-grad)" />
    <path d="M 375 138 C 380 132 390 135 390 143 C 385 146 378 142 375 138 Z" fill="url(#gold-grad)" />
    <path d="M 380 152 C 385 148 395 152 392 160 C 387 162 382 156 380 152 Z" fill="url(#gold-grad)" />
    <path d="M 378 168 C 382 164 390 170 388 178 C 382 178 380 172 378 168 Z" fill="url(#gold-grad)" />
    
    <!-- stems -->
    <path d="M 215 178 Q 230 185 245 180" stroke="url(#gold-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 385 178 Q 370 185 355 180" stroke="url(#gold-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    
    <!-- small stars -->
    <polygon points="275,142 277,146 281,146 278,148 279,152 275,150 271,152 272,148 269,146 273,146" fill="url(#gold-grad)" opacity="0.9" />
    <polygon points="325,142 327,146 331,146 328,148 329,152 325,150 321,152 322,148 319,146 323,146" fill="url(#gold-grad)" opacity="0.9" />

    <!-- Car Body -->
    <g transform="translate(10, 10)">
      <path d="M 125,265 
               C 120,253 125,243 138,238 
               C 155,232 185,215 215,205 
               C 245,195 285,190 325,195 
               C 355,198 395,200 425,208 
               C 440,212 455,216 458,223
               C 460,230 445,235 425,242 
               C 385,255 330,275 270,298 
               C 210,320 165,335 135,340 
               C 126,342 120,332 118,322 
               C 116,310 128,295 125,265 Z" 
            fill="#FFFFFF" />
      <path d="M 235,218
               C 260,210 290,207 325,210
               C 345,212 360,218 362,223
               C 345,225 325,227 305,230
               C 275,235 250,242 232,245
               C 229,245 227,238 235,218 Z" 
            fill="#0C153E" />
      <path d="M 155,275 Q 260,245 385,230" stroke="#0C153E" stroke-width="2.5" fill="none" />
      <circle cx="195" cy="298" r="20" fill="#0C153E" />
      <circle cx="388" cy="246" r="20" fill="#0C153E" />
    </g>

    <!-- Division strip -->
    <path d="M 140,335 L 435,232 L 435,237 L 140,341 Z" fill="url(#gold-grad)" />

    <!-- Haiti map -->
    <g transform="translate(10, 10)">
      <path d="M 380,285 
               C 380,305 382,325 380,340 
               C 345,343 305,345 265,349 
               C 245,345 245,335 265,331 
               C 295,331 315,327 315,327 
               C 330,317 320,303 320,303 
               C 305,300 290,295 290,287 
               C 310,289 330,292 330,292 
               C 350,289 380,285 380,285 Z" 
            fill="url(#gold-grad)" />
      <ellipse cx="298" cy="318" rx="15" ry="7" transform="rotate(-15 298 318)" fill="url(#gold-grad)" />
      <ellipse cx="295" cy="272" rx="10" ry="4" fill="url(#gold-grad)" />
    </g>
  </g>

  <!-- ================= TEXT SECTION (DARK BLUE FOR LIGHT BACKGROUND) ================= -->
  <!-- SIAAH main bold text with extra padding/margin from graphic -->
  <text x="160" y="70" 
        font-family="'Montserrat', 'Helvetica', 'Arial Black', sans-serif" 
        font-size="62" 
        font-weight="900" 
        fill="#0D163D" 
        text-anchor="start" 
        letter-spacing="1">SIAAH</text>

  <!-- Subtitle lines -->
  <text x="161" y="102" 
        font-family="'Montserrat', 'Helvetica', 'Arial', sans-serif" 
        font-size="16.5" 
        font-weight="bold" 
        fill="#0D163D" 
        text-anchor="start" 
        letter-spacing="0.5">Société de l'Immatriculation</text>

  <text x="161" y="128" 
        font-family="'Montserrat', 'Helvetica', 'Arial', sans-serif" 
        font-size="16.5" 
        font-weight="bold" 
        fill="#0D163D" 
        text-anchor="start" 
        letter-spacing="0.5">et de l'Assurance</text>

  <text x="161" y="154" 
        font-family="'Montserrat', 'Helvetica', 'Arial', sans-serif" 
        font-size="16.5" 
        font-weight="bold" 
        fill="#0D163D" 
        text-anchor="start" 
        letter-spacing="0.5">Automobile en Haïti</text>
</svg>
